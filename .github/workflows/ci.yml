name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install ast-grep
        run: cargo install ast-grep --locked

      - name: Install dependencies
        run: deno install --frozen

      - name: Commit and PR message validation
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.after }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "Skipping commit-range validation for tag push."
          elif [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "Initial branch push; the pull request check will validate its full commit range."
          else
            deno run --allow-read --allow-run tooling/check-commit-range.ts "$BASE_SHA" "$HEAD_SHA"
          fi
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/pr-title"
            deno run --allow-read tooling/check-commit-message.ts "$RUNNER_TEMP/pr-title"
          fi

      - name: Format
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno task check

      - name: Drizzle migration graph
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/ritsei
        run: deno task db:check

      - name: Roadmap measurement
        run: deno task roadmap:measure

      - name: Agent skills
        run: deno task skills:check

      - name: Boundary tests
        run: deno task boundary:test

      - name: Boundary lint
        run: deno task boundary:lint

      - name: Tests
        run: deno task test

      - name: Fallow audit
        run: deno task fallow:audit

  nix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Flake check
        run: nix flake check --all-systems
